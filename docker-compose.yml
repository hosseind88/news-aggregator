services:
  web:
    build: .
    image: news-aggregator
    ports:
      - '${WEB_PORT:-3000}:80'
    # Compose reads ./.env automatically; keys are passed to nginx at runtime.
    environment:
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GUARDIAN_KEY: ${GUARDIAN_KEY:-}
      NYT_KEY: ${NYT_KEY:-}
    restart: unless-stopped

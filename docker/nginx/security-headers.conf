# Included in every location that sets its own add_header: nginx drops inherited headers as soon
# as a location defines one, which is how /assets/ used to lose these.
#
# CSP notes: the build emits no inline scripts/styles and loads nothing cross-origin except
# article thumbnails (any https host) -> img-src. Radix/React set style *attributes* at runtime,
# so only style-src-attr allows 'unsafe-inline'; <style> and <script> stay locked to 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
